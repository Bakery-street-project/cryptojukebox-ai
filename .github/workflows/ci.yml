name: CI — cryptojukebox-ai

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  # no pull_request trigger: CI runs on the repo's self-hosted runner
  # (jukebox-arch); fork PRs would execute attacker-chosen code there.

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    runs-on: [self-hosted, jukebox-ci]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (strict)
        run: bunx tsc --noEmit
      - name: Tests
        run: bun test
      - name: Edge Worker typecheck (cloudflare/)
        run: |
          cd cloudflare
          bun install --frozen-lockfile
          bunx tsc --noEmit

  # CodeQL was moved off GitHub's default setup (which ran on billing-
  # locked GitHub-hosted runners) onto this self-hosted job. TS analysis
  # needs only the source tree, so autobuild is disabled.
  codeql:
    runs-on: [self-hosted, jukebox-ci]
    strategy:
      fail-fast: false
      matrix:
        language: [typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
        with:
          autobuild: false
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
