name: CI — cryptojukebox-ai

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  # no pull_request trigger: CI runs on the repo's self-hosted runner
  # (jukebox-arch); fork PRs would execute attacker-chosen code there.

jobs:
  quality:
    runs-on: [self-hosted, jukebox-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (strict)
        run: bunx tsc --noEmit
      - name: Tests
        run: bun test
      - name: Edge Worker typecheck (cloudflare/)
        run: |
          cd cloudflare
          bun install --frozen-lockfile
          bunx tsc --noEmit
